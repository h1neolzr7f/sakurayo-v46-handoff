name: restore-shell
# A previous Contents API push truncated src/runtime/sakurayo-shell.js to ~1KB.
# This re-points the path at the known-good blob already on GitHub.

on:
  push:
    branches:
      - cursor/yeying-touch-fix-eaa0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore sakurayo-shell.js from the known-good blob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          owner = "h1neolzr7f"
          repo = "sakurayo-v46-handoff"
          branch = "cursor/yeying-touch-fix-eaa0"
          path = "src/runtime/sakurayo-shell.js"
          good_blob = "9cbe5599736a430471da7059499a28fa7bc92eab"
          token = os.environ["GH_TOKEN"]

          def api(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "restore-shell",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as res:
                      raw = res.read()
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise RuntimeError(f"{method} {url} -> {error.code} {detail}") from error

          base = f"https://api.github.com/repos/{owner}/{repo}"
          ref = api("GET", f"{base}/git/ref/heads/{branch}")
          commit_sha = ref["object"]["sha"]
          commit = api("GET", f"{base}/git/commits/{commit_sha}")
          meta = api("GET", f"{base}/contents/{path}?ref={branch}")
          current = meta.get("sha")
          size = meta.get("size")
          print(f"current {path} sha={current} size={size}")
          if current == good_blob:
              print("already restored")
              raise SystemExit(0)

          tree = api("POST", f"{base}/git/trees", {
              "base_tree": commit["tree"]["sha"],
              "tree": [{
                  "path": path,
                  "mode": "100644",
                  "type": "blob",
                  "sha": good_blob,
              }],
          })
          new_commit = api("POST", f"{base}/git/commits", {
              "message": "Restore the full sakurayo-shell.js after a truncated push.",
              "tree": tree["sha"],
              "parents": [commit_sha],
          })
          api("PATCH", f"{base}/git/refs/heads/{branch}", {
              "sha": new_commit["sha"],
          })
          print("restored", new_commit["sha"])
          PY
