name: yeying-dev-apk

on:
  push:
    branches:
      - cursor/yeying-dev-apk-eaa0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync feel53 and rebuild the single HTML entry
        run: |
          mkdir -p android-app/app/src/main/assets/runtime
          cp src/runtime/sakurayo-feel53.js android-app/app/src/main/assets/runtime/sakurayo-feel53.js
          python3 tools/build_game.py \
            --source src/index.html \
            --output android-app/app/src/main/assets/index.html \
            --asset-root android-app/app/src/main/assets/game/art

      - name: Assemble debug APK
        working-directory: android-app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name the side-load APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk YeYing-Dev-v4.6.0-android.apk
          sha256sum YeYing-Dev-v4.6.0-android.apk | tee yeying-dev-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: YeYing-Dev-v4.6.0-android
          path: |
            YeYing-Dev-v4.6.0-android.apk
            yeying-dev-apk.sha256

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes='给作者自己试玩的侧载包，不是对玩家发的 4.6.0。

- 桌面名：开发版 夜樱
- 包名：com.sakurayo.yeying.dev
- versionName：4.6.0-yeying / versionCode 6101
- 不会覆盖正式樱夜·尸潮（com.sakurayo.zombietide）
- Debug 证书签名，只适合自己装

文件：YeYing-Dev-v4.6.0-android.apk'
          for i in 1 2 3 4 5 6 7 8; do
            if gh release view yeying-dev-v4.6.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload yeying-dev-v4.6.0 YeYing-Dev-v4.6.0-android.apk --repo "$GITHUB_REPOSITORY" --clobber && exit 0
            elif gh release create yeying-dev-v4.6.0 YeYing-Dev-v4.6.0-android.apk --repo "$GITHUB_REPOSITORY" --title "开发版 夜樱 4.6.0" --prerelease --notes "$notes"; then
              exit 0
            fi
            echo "release attempt $i failed; sleeping"
            sleep $((i * 15))
          done
          echo "Release API still failing; APK remains in Actions artifacts"
          exit 0
