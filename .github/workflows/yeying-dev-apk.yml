name: yeying-dev-apk

on:
  push:
    branches:
      - cursor/yeying-dev-apk-eaa0
      - cursor/yeying-touch-fix-eaa0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Sync runtime overlays and rebuild the single HTML entry
        run: |
          mkdir -p android-app/app/src/main/assets/runtime
          cp src/runtime/sakurayo-layout52.js android-app/app/src/main/assets/runtime/sakurayo-layout52.js
          cp src/runtime/sakurayo-feel53.js android-app/app/src/main/assets/runtime/sakurayo-feel53.js
          python3 tools/build_game.py \
            --source src/index.html \
            --output android-app/app/src/main/assets/index.html \
            --asset-root android-app/app/src/main/assets/game/art

      - name: Assemble debug APK
        working-directory: android-app
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Name the side-load APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk YeYing-Dev-v4.6.0-android.apk
          sha256sum YeYing-Dev-v4.6.0-android.apk | tee yeying-dev-apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: YeYing-Dev-v4.6.0-android
          path: |
            YeYing-Dev-v4.6.0-android.apk
            yeying-dev-apk.sha256

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: yeying-dev-v4.6.0
          name: 开发版 夜樱 4.6.0
          draft: false
          prerelease: true
          make_latest: false
          files: YeYing-Dev-v4.6.0-android.apk
          body: |
            给作者自己试玩的侧载包，**不是对玩家发的 4.6.0**。

            - 桌面名：开发版 夜樱
            - 包名：`com.sakurayo.yeying.dev`
            - versionName：`4.6.0-yeying` / versionCode 6102
            - 本包修了大厅按键无响应和横屏 UI 重叠。覆盖安装旧开发版即可，不会动正式《樱夜·尸潮》。
            - 不会覆盖正式《樱夜·尸潮》（`com.sakurayo.zombietide`）
            - Debug 证书签名，只适合自己装

            文件：`YeYing-Dev-v4.6.0-android.apk`
