name: verify

on:
  push:
    branches: [main, 'codex/audit-integration-*']
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install Pillow
      - name: Static check and syntax
        run: bash tools/verify.sh --static

  offline-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python -m pip install Pillow
      - run: npx playwright install --with-deps chromium
      - name: Diagnose isolated starter runs
        run: node tests/balance_diagnostic.mjs
      - name: Source and offline bundle regression
        run: bash tools/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-verification
          path: tests/artifacts/

  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bundle current game source
        run: python tools/build_game.py --source src/index.html --output android-app/app/src/main/assets/index.html --asset-root android-app/app/src/main/assets/game/art
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build and lint debug shell
        working-directory: android-app
        run: bash gradlew --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android-app/app/build/reports/lint-results-debug.*
