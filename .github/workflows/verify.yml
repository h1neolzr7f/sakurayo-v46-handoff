name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install test runtime
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Static, unit, and browser regression
        run: npm test
      - name: Landscape visual regression
        run: npm run test:visual
