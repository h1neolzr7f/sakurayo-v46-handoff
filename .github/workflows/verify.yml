name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Static check and syntax
        run: |
          python tools/static_check.py src/index.html
          node --check tests/artifacts/static/index.extracted.js
          node --check src/runtime/sakurayo-cutscene.js
          node --check src/runtime/sakurayo-economy.js
          node --check src/runtime/sakurayo-lifecycle.js
          node --check src/runtime/sakurayo-content-runtime.js
          node --check src/runtime/sakurayo-command.js
          node --check src/runtime/sakurayo-services.js
          node --check src/runtime/sakurayo-terminal.js
          node tests/command_unit.mjs
          node tests/services_unit.mjs
          node tests/chapter_design_unit.mjs

  offline-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: python -m pip install Pillow
      - run: npx playwright install --with-deps chromium
      - name: Source and offline bundle regression
        run: bash tools/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-verification
          path: tests/artifacts/
