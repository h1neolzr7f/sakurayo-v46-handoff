<!doctype html>
<html lang="zh-CN" class="landscape46 portraitFallback46">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>all surfaces touch</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#090714;color:#fff;font-family:system-ui}
    button{border:0;color:inherit;font:inherit}
    canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;background:#221133}
    #menu{position:fixed;inset:0;z-index:10}
    .menu{position:absolute;inset:0;pointer-events:none}
    .heroLive46{position:absolute;inset:0;width:70%;background:#f35aa633;pointer-events:none}
    .homeDeck46{display:contents}
    .start{position:absolute;right:16px;top:80px;min-height:52px;min-width:140px;background:#f35aa6}
    .homeNav46{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);pointer-events:auto}
    .charSelectPanel{position:absolute;left:220px;top:10px;pointer-events:auto}
    .drawer,.overlay,#paused,#result,#level{position:fixed;inset:0;z-index:20;background:#080713ee}
    .hidden{display:none!important}
    #hud{position:fixed;inset:0;z-index:4;pointer-events:none}
    #pause,#dash,#skill{pointer-events:auto;position:absolute;width:48px;height:48px;background:#333}
    #pause{top:8px;right:8px}
    #dash{bottom:16px;right:80px}
    #skill{bottom:16px;right:16px}
    .log{position:fixed;z-index:40;right:8px;top:8px;font:700 12px/1.3 system-ui;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <section id="menu" class="homeDock46">
    <div class="heroLive46"></div>
    <div class="menu">
      <div class="charSelectPanel"><button class="charCard" id="charAya" data-character="aya">绫</button></div>
      <div class="homeDeck46">
        <button class="start" id="start">出击</button>
        <div class="homeModes46">
          <button id="modeTestimony" data-mode="testimony">证词模式</button>
          <button id="modeDomain" data-mode="mainGod">主神空间</button>
        </div>
      </div>
      <nav class="nav homeNav46">
        <button id="navGacha" data-open="gacha">寻访</button>
        <button id="navRoster" data-open="roster">名册</button>
        <button id="navShop" data-open="shop">商店</button>
        <button id="navStage" data-open="stage">关卡</button>
        <button id="navArchive" data-open="archive">档案</button>
      </nav>
    </div>
    <nav id="homeRail46" class="homeRail46" style="position:absolute;left:8px;top:64px;z-index:12">
      <button id="railMission" data-home="mission">任务</button>
      <button id="railAch" data-home="ach">成就</button>
      <button id="railMail" data-home="mail">邮件</button>
      <button id="railSettings" data-home="settings">设置</button>
    </nav>
  </section>
  <section id="shopDrawer" class="drawer hidden"><div class="dhead"><button class="close" id="shopClose">×</button></div><button id="shopBuy">购买</button></section>
  <section id="gachaDrawer" class="drawer hidden"><button class="close" id="gachaClose">×</button><button id="gachaPull">寻访一次</button></section>
  <section id="level" class="hidden"><button class="choice" id="levelPick">选升级</button></section>
  <section id="paused" class="hidden"><button id="resume">继续</button></section>
  <section id="result" class="hidden"><button id="back">返回大厅</button></section>
  <div id="hud" class="hidden"><button id="pause">暂停</button><button id="dash">闪避</button><button id="skill">技能</button></div>
  <div class="log" id="log">idle</div>
  <script>
    window.__clicks = {};
    window.__canvasDown = 0;
    function mark(id) {
      window.__clicks[id] = (window.__clicks[id] || 0) + 1;
      document.getElementById("log").textContent = id + ":" + window.__clicks[id];
    }
    ["start","charAya","modeTestimony","modeDomain","navGacha","navRoster","navShop","navStage","navArchive","railMission","railAch","railMail","railSettings","shopClose","shopBuy","gachaClose","gachaPull","levelPick","resume","back","pause","dash","skill"].forEach(function (id) {
      var el = document.getElementById(id);
      if (el) el.addEventListener("click", function () { mark(id); });
    });
    document.getElementById("cv").addEventListener("pointerdown", function () { window.__canvasDown += 1; });
    window.__SAKURAYO_ANDROID_LANDSCAPE__ = true;
  </script>
  <script src="../../src/runtime/sakurayo-touch54.js"></script>
  <script src="../../src/runtime/sakurayo-layout52.js"></script>
</body>
</html>
