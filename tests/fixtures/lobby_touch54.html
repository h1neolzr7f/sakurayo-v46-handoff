<!doctype html>
<html lang="zh-CN" class="landscape46 portraitFallback46">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>lobby touch fixture</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none;background:#090714;color:#fff;font-family:system-ui,sans-serif}
    button{border:0;color:inherit;font:inherit}
    #menu{position:fixed;inset:0}
    .bg{position:absolute;inset:0;background:#12081c;pointer-events:none}
    .menu{position:absolute;inset:0}
    html.landscape46:not(.portraitFallback46) .menu{pointer-events:none}
    .top{position:absolute;left:16px;right:16px;top:10px;display:flex;justify-content:space-between;z-index:7;pointer-events:auto}
    .heroLive46{position:absolute;left:0;top:0;bottom:0;width:64%;background:#f35aa644;z-index:5}
    html.portraitFallback46 .heroLive46{width:100%;bottom:34%}
    .homeDeck46{display:contents}
    html.landscape46:not(.portraitFallback46) .homeDeck46{display:flex;flex-direction:column;position:absolute;right:16px;top:64px;bottom:86px;width:34vw;z-index:6;pointer-events:auto}
    .start{min-height:52px;background:#f35aa6}
    .homeNav46{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:8;pointer-events:auto}
    .charSelectPanel{position:absolute;left:220px;top:10px;z-index:7;pointer-events:auto}
    html.portraitFallback46 .charSelectPanel{left:8px;bottom:36%;top:auto}
    .log{position:fixed;right:8px;top:8px;z-index:30;font:700 12px/1.2 system-ui}
  </style>
</head>
<body>
  <div id="menu" class="homeDock46">
    <div class="bg"></div>
    <div class="heroLive46" id="heroLive46"></div>
    <div class="menu">
      <div class="top">
        <div class="profile" id="profile"><b id="charName">月城小夜</b></div>
        <div class="coins">120</div>
      </div>
      <div class="charSelectPanel"><button class="charCard" data-character="aya" id="charAya">绫</button></div>
      <div class="homeDeck46">
        <button class="start" id="start">出击</button>
      </div>
      <nav class="nav homeNav46"><button id="navShop">商店</button></nav>
    </div>
  </div>
  <div class="log" id="log">idle</div>
  <script>
    window.__clicks = { start: 0, shop: 0, char: 0 };
    ["start", "navShop", "charAya"].forEach(function (id) {
      document.getElementById(id).addEventListener("click", function () {
        var key = id === "start" ? "start" : id === "navShop" ? "shop" : "char";
        window.__clicks[key] += 1;
        document.getElementById("log").textContent = key + ":" + window.__clicks[key];
      });
    });
  </script>
  <script src="../../src/runtime/sakurayo-layout52.js"></script>
</body>
</html>
